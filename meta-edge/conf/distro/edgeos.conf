# EdgeOS — industrial edge gateway distribution.
# Derived from openembedded-core nodistro defaults; no Poky dependency.

DISTRO = "edgeos"
DISTRO_NAME = "EdgeOS"
DISTRO_VERSION = "0.1+snapshot"
DISTRO_CODENAME = "initial"

TARGET_VENDOR = "-edgeos"

LOCALCONF_VERSION = "2"
SDK_VENDOR = "-edgeossdk"
SDK_VERSION = "0.1"
SDK_LOCALE = "en-US.UTF-8"

# Minimal feature set for a headless industrial edge device.
# No desktop/GUI; networking, systemd, and security basics included.
DISTRO_FEATURES ?= " \
    acl \
    argp \
    ext2 \
    ipv4 \
    ipv6 \
    largefile \
    pam \
    systemd \
    usbhost \
    wifi \
    xattr \
    "

# systemd as init; prevent sysvinit from being pulled in by the backfill mechanism
VIRTUAL-RUNTIME_init_manager = "systemd"
VIRTUAL-RUNTIME_initscripts = "systemd-compat-units"
DISTRO_FEATURES_BACKFILL_CONSIDERED += "sysvinit pulseaudio"
